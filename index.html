<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Battle of Ocean 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--ink:#10252e;--paper:#fff8ea;--glass:rgba(255,255,255,.72);--glassb:rgba(255,255,255,.9);--text:#10252e;--muted:#5b7078;--a:#ef6a4c;--s1:#9fdcf0;--s2:#fff0c8;--g1:#e9cf92;--g2:#d4b06a;--bgsel:#cfeef7;--bgsel2:#f6e7c1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(16,30,38,.72);--glassb:rgba(20,38,48,.92);--text:#f5ecd9;--muted:#9db3bb;--bgsel:#0f2b38;--bgsel2:#1b3a45}}
:root[data-theme="dark"]{--glass:rgba(16,30,38,.72);--glassb:rgba(20,38,48,.92);--text:#f5ecd9;--muted:#9db3bb;--bgsel:#0f2b38;--bgsel2:#1b3a45}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;color:var(--text);background:#0c1f28;overflow-x:hidden}
.screen{display:none;min-height:100vh;position:relative;overflow:hidden;flex-direction:column}
.screen.on{display:flex}
/* ===== scene ===== */
#intro{background:linear-gradient(var(--s1),var(--s2) 70%);transition:background .6s}
.bar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:16px;right:16px;display:flex;gap:6px;z-index:5}
.bar i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.55);overflow:hidden}
.bar i b{display:block;height:100%;width:0;background:#fff}
.bar i.done b{width:100%}
.bar i.act b{animation:fill 5.6s linear forwards}
@keyframes fill{to{width:100%}}
.sun{position:absolute;top:14%;left:10%;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,#fff7c2 0 35%,rgba(255,240,170,.0) 70%);filter:blur(1px)}
.cloud{position:absolute;font-size:3.4rem;opacity:.8;animation:drift 22s linear infinite}
.cloud.c2{top:30%;font-size:2.4rem;animation-duration:30s;animation-delay:-12s}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.back{position:absolute;left:0;right:0;bottom:30%;display:flex;justify-content:space-around;font-size:3.6rem;opacity:.55;filter:blur(.6px)}
.land{position:absolute;left:0;right:0;bottom:0;height:46%}
.land svg{position:absolute;bottom:0;width:100%;height:100%}
.w1{fill:var(--g1)}.w2{fill:var(--g2)}
.waves{animation:sway 5s ease-in-out infinite alternate}
@keyframes sway{to{transform:translateX(-4%)}}
.stage{position:relative;flex:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:30%}
.puppet{position:relative;animation:sm .75s steps(1) infinite}
@keyframes sm{0%{transform:rotate(-3deg) translate(0,0)}25%{transform:rotate(2deg) translate(3px,-5px)}50%{transform:rotate(-1deg) translate(-3px,2px)}75%{transform:rotate(3deg) translate(2px,-3px)}}
.hero{font-size:8.5rem;line-height:1;display:block;filter:drop-shadow(0 10px 0 rgba(0,0,0,.18))}
.food{position:absolute;right:-26px;bottom:6px;font-size:3rem;animation:sm .5s steps(1) infinite}
.shadow{position:absolute;left:50%;bottom:-14px;width:120px;height:22px;margin-left:-60px;border-radius:50%;background:rgba(0,0,0,.18)}
.idea{position:absolute;left:50%;top:-42px;font-size:3.6rem;transform:translateX(-50%) scale(0);opacity:0}
.idea.pop{animation:pop .5s steps(5) forwards}
@keyframes pop{to{transform:translateX(-50%) scale(1);opacity:1}}
.think{position:absolute;right:6%;top:15%;opacity:0;transform:scale(.4);transform-origin:20% 100%;text-align:center;z-index:3}
.think.pop{animation:pop2 .6s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes pop2{to{opacity:1;transform:scale(1)}}
.cloudb{background:#fff;color:#10252e;border-radius:46% 54% 50% 50%/55% 55% 45% 45%;padding:18px 24px 12px;font-size:4.4rem;line-height:1;box-shadow:0 10px 24px rgba(0,0,0,.18)}
.cloudb small{display:block;font-size:.9rem;font-weight:600;margin-top:6px;color:#5b7078}
.dotsb{position:absolute;left:-14px;bottom:-30px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:-12px 20px 0 -3px #fff}
.cap{position:relative;z-index:4;margin:0 16px 18px;padding:16px 18px;border-radius:22px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 28px rgba(0,0,0,.15);text-align:center;min-height:92px}
.cap h2{margin:0 0 4px;font-size:1.4rem}
.cap p{margin:0;color:var(--muted);font-size:1rem;line-height:1.35}
.skip{position:absolute;right:16px;top:calc(env(safe-area-inset-top,0px) + 26px);z-index:6;border:0;border-radius:99px;padding:7px 14px;background:var(--glass);color:var(--text);font:inherit;font-size:.85rem;backdrop-filter:blur(8px)}
.vig{position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.28));animation:flick .4s steps(1) infinite}
@keyframes flick{0%{opacity:.9}50%{opacity:1}}
/* ===== title ===== */
#title{background:radial-gradient(circle at 50% 30%,#2b7a93,#0c1f28 70%);align-items:center;justify-content:center;text-align:center;color:#fff;gap:6px}
#title h1{margin:0;font-size:3.1rem;line-height:1;text-shadow:0 6px 0 rgba(0,0,0,.25);animation:rise 1s both}
#title h1 span{display:block;color:#ffd27a}
#title p{opacity:.85;animation:rise 1s .5s both;margin:10px 0 0}
#title .row{font-size:2.2rem;letter-spacing:.3em;margin-top:18px;animation:rise 1s .9s both}
@keyframes rise{from{opacity:0;transform:translateY(20px)}}
/* ===== select ===== */
#select{background:linear-gradient(var(--bgsel),var(--bgsel2));align-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 16px;gap:14px}
#select h1{margin:6px 0 0;font-size:1.5rem}
#select .sub{margin:0;color:var(--muted);font-size:.95rem}
.hall{width:100%;max-width:440px;border-radius:30px;padding:22px 18px 18px;background:linear-gradient(160deg,var(--c1),var(--c2));color:#fff;text-align:center;position:relative;box-shadow:0 18px 40px rgba(0,0,0,.25);transition:background .4s;overflow:hidden}
.hall::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.14);left:50%;top:-40px;margin-left:-130px}
.hall .big{font-size:6.6rem;line-height:1;position:relative;display:block;animation:sm 1s steps(1) infinite;filter:drop-shadow(0 8px 0 rgba(0,0,0,.2))}
.hall h2{margin:8px 0 2px;font-size:1.8rem;position:relative}
.hall .unit{display:inline-block;background:rgba(255,255,255,.22);border-radius:99px;padding:5px 14px;font-weight:600;position:relative}
.hall .desc{font-size:.95rem;margin:10px 0 14px;opacity:.95;position:relative}
.st{display:grid;grid-template-columns:78px 1fr;gap:6px 10px;align-items:center;text-align:left;font-size:.9rem;position:relative}
.st div.t{height:9px;border-radius:9px;background:rgba(0,0,0,.22);overflow:hidden}
.st div.t b{display:block;height:100%;border-radius:9px;background:#fff;transition:width .5s}
.pick{display:flex;gap:10px;justify-content:center}
.chip{width:58px;height:58px;border-radius:50%;border:3px solid transparent;background:var(--glassb);font-size:1.9rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s;box-shadow:0 6px 14px rgba(0,0,0,.15)}
.chip.sel{transform:translateY(-6px) scale(1.12);border-color:var(--a)}
.go{width:100%;max-width:440px;border:0;border-radius:18px;padding:16px;font:inherit;font-size:1.15rem;font-weight:700;color:#fff;background:var(--a);box-shadow:0 8px 0 rgba(0,0,0,.2);cursor:pointer}
.go:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.2)}
.msg{text-align:center;color:var(--muted);min-height:1.3em;font-size:.95rem;margin:0}

/* ===== photos ===== */
.bgimg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s;z-index:0}
.bgimg.on{opacity:1;animation:kb 9s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.1)}}
.shade{position:absolute;inset:0;z-index:1;display:none;background:linear-gradient(rgba(0,0,0,.18),transparent 30%,transparent 50%,rgba(0,0,0,.5))}
#intro.photo .shade{display:block}
#intro.photo .sun,#intro.photo .cloud,#intro.photo .back,#intro.photo .land,#intro.photo .shadow{display:none}
.stage{z-index:2}
#intro.photo .stage{padding-bottom:5%}
.hp{display:none;width:min(56vw,230px);height:min(68vw,280px);object-fit:cover;border-radius:26px;border:5px solid #fff;box-shadow:0 20px 44px rgba(0,0,0,.45);background:#cfd8dc}
.vimg{display:none;width:150px;height:96px;object-fit:cover;border-radius:16px}
.hbg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .6s;mix-blend-mode:multiply}
.hbg.on{opacity:.55}
.hall .ph{display:none;position:relative;width:100%;height:190px;object-fit:cover;border-radius:22px;border:3px solid rgba(255,255,255,.85);box-shadow:0 10px 24px rgba(0,0,0,.3);margin-bottom:6px}
.chip{overflow:hidden;padding:0}
.chip img{width:100%;height:100%;object-fit:cover}
.credit{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 3px);text-align:center;font-size:.68rem;color:#fff;opacity:.7;z-index:9;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.6)}

/* ===== bitwa ===== */
#battle{background:#06161d;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;height:100vh;height:100dvh}
#cv{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;align-items:center;gap:10px;z-index:5;pointer-events:none}
.hud .hb{flex:1;height:14px;border-radius:9px;background:rgba(0,0,0,.5);overflow:hidden;border:2px solid rgba(255,255,255,.7)}
.hud .hb b{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ef6a4c,#ffd27a);transition:width .15s}
.hud #hi{font-size:.9rem;font-weight:600;text-shadow:0 2px 4px #000;white-space:nowrap}
.hud button{pointer-events:auto;border:0;border-radius:50%;width:34px;height:34px;background:rgba(0,0,0,.5);color:#fff;font:inherit}
#hint{position:absolute;left:0;right:0;top:20%;text-align:center;z-index:5;pointer-events:none;font-size:1rem;text-shadow:0 2px 6px #000;transition:opacity 1s;padding:0 30px}
.shop{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;background:rgba(5,20,28,.86);backdrop-filter:blur(6px);text-align:center}
.shop.on{display:flex}
.shop h2{margin:0;font-size:1.6rem}.shop p{margin:0 0 4px;font-size:1.1rem}
.up{width:100%;max-width:420px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;border:2px solid rgba(255,255,255,.3);border-radius:16px;padding:12px 14px;background:rgba(255,255,255,.1);color:#fff;font:inherit;cursor:pointer}
.up span{grid-column:1;font-size:.82rem;opacity:.8}.up i{grid-column:2;grid-row:1/3;align-self:center;font-style:normal;font-weight:700;color:#ffd27a}
.up:disabled{opacity:.42;cursor:default}
.up:not(:disabled):active{transform:scale(.98)}
#jy,#jk{position:absolute;display:none;pointer-events:none;border-radius:50%;z-index:4}#jy{width:100px;height:100px;border:3px solid rgba(255,255,255,.5)}#jk{width:40px;height:40px;background:rgba(255,255,255,.55)}
</style>
</head>
<body>

<section class="screen on" id="title">
  <div class="row">🐦 🐟 🦈 🐙 🦫</div>
  <h1>Battle<span>of Ocean</span></h1>
  <p>Strategiczna wojna zwierząt</p>
</section>

<section class="screen" id="intro">
  <div class="bgimg" id="bgimg"></div><div class="shade"></div>
  <div class="bar" id="bar"></div>
  <button class="skip" id="skip">Pomiń ▸</button>
  <div class="sun"></div><div class="cloud">☁️</div><div class="cloud c2">☁️</div>
  <div class="back" id="back"></div>
  <div class="land"><svg viewBox="0 0 400 200" preserveAspectRatio="none"><g class="waves"><path class="w2" d="M-40 60 Q40 30 120 60 T280 60 T440 60 V200 H-40Z"/></g><path class="w1" d="M0 100 Q80 70 160 100 T320 100 T480 100 V200 H0Z"/></svg></div>
  <div class="stage"><div class="puppet"><span class="idea" id="idea">💡</span><img class="hp" id="hp" alt=""><span class="hero" id="hero"></span><span class="food" id="food"></span><span class="shadow"></span></div></div>
  <div class="think" id="think"><div class="cloudb"><img class="vimg" id="vimg" alt=""><span id="veh"></span><small id="vn"></small></div><span class="dotsb"></span></div>
  <div class="cap"><h2 id="ct"></h2><p id="cp"></p></div>
  <div class="vig"></div>
</section>

<section class="screen" id="select">
  <h1>Wybierz dowódcę</h1>
  <p class="sub">Każdy bohater prowadzi inną jednostkę</p>
  <div class="hall" id="hall">
    <div class="hbg" id="hbg"></div><img class="ph" id="hph" alt=""><span class="big" id="hb"></span><h2 id="hn"></h2><span class="unit" id="hu"></span>
    <p class="desc" id="hd"></p>
    <div class="st"><span>Atak</span><div class="t"><b id="sa"></b></div><span>Pancerz</span><div class="t"><b id="sp"></b></div><span>Szybkość</span><div class="t"><b id="ss"></b></div></div>
  </div>
  <div class="pick" id="pick"></div>
  <button class="go" id="go">Wypłyń do bitwy</button>
  <p class="msg" id="msg"></p>
</section>

<div class="credit">Zdjęcia: Wikimedia Commons</div>
<section class="screen" id="battle">
  <canvas id="cv"></canvas>
  <div class="hud"><div class="hb"><b id="hpb"></b></div><span id="hi"></span><button id="qx" aria-label="Wyjdź">✕</button></div>
  <div id="hint">Przeciągnij palcem (lub WASD), aby się poruszać.<br>Atak działa automatycznie.</div>
  <div class="shop" id="ov"></div><div id="jy"></div><div id="jk"></div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var S=[
 {h:'🐦',img:{f:'Seagull on sale pier.jpg',q:'seagull'},bg:{q:'tropical beach palm trees turquoise sea'},vi:{q:'F-16 Fighting Falcon in flight'},n:'Mewa',food:['🍟','🍟','🍟','🍟'],s1:'#8fd3f2',s2:'#fff1cf',g1:'#ecd59b',g2:'#dcbb78',back:['🌴','🏖️','🌴'],u:'Myśliwiec',v:'✈️',a:5,p:2,s:5,c1:'#3aa0d8',c2:'#1c6fa8',
  t:'Mewa i frytka',tx:'Mewa podjada frytkę na plaży. Nagle olśnienie… myśli o myśliwcu!',d:'Szybka i bezlitosna. Atakuje z powietrza.'},
 {h:'🦫',img:{f:'Capybara. Hydrochoerus hydrochaeris.jpg',q:'capybara'},bg:{q:'green forest river sunlight trees'},vi:{q:'Stryker armored vehicle'},n:'Kapibara',food:['🌿','🍃','🌿','🍃'],s1:'#b7e0a5',s2:'#f6f0c4',g1:'#8fbf62',g2:'#6fa04a',back:['🌲','🌳','🌲','🌳'],u:'Transporter opancerzony',v:'🛡️🚙',a:3,p:5,s:2,c1:'#7aa84a',c2:'#476b2b',
  t:'Kapibara w lesie',tx:'Kapibara drzemie spokojnie wśród drzew. W jej głowie rośnie opancerzony transporter.',d:'Spokojna jak głaz. Nic jej nie ruszy.'},
 {h:'🐟',img:{f:'Amphiprion ocellaris (Clown anemonefish) by Nick Hobgood.jpg',q:'clownfish anemone'},bg:{q:'coral reef underwater blue'},vi:{q:'Ticonderoga-class cruiser underway'},n:'Ryba',food:['🫧','🫧','🫧','🫧'],s1:'#7fd0e8',s2:'#d8f3f0',g1:'#4fb3cf',g2:'#2f8fb0',back:['🪸','🌊','🪸'],u:'Krążownik',v:'🚢',a:4,p:3,s:3,c1:'#1fb0b8',c2:'#0e6f85',
  t:'Ryba i głębia',tx:'Ryba wpatruje się w błękit. Wyobraża sobie potężny krążownik.',d:'Wszechstronna dowódczyni floty.'},
 {h:'🦈',img:{f:'White shark.jpg',q:'great white shark underwater'},bg:{q:'deep blue ocean underwater sunbeams'},vi:{q:'Virginia-class submarine surfaced'},n:'Rekin',food:['🩸','🌊','🩸','🌊'],s1:'#6fa1c2',s2:'#c7dbe6',g1:'#3f7396',g2:'#2a5878',back:['🌊','⚓','🌊'],u:'Okręt podwodny',v:'⚓🕳️',a:5,p:3,s:3,c1:'#4f7fa0',c2:'#27475f',
  t:'Rekin w toni',tx:'Rekin krąży w ciemnej wodzie. Olśnienie: okręt podwodny!',d:'Atakuje z ukrycia, zanim ktoś go zauważy.'},
 {h:'🐙',img:{f:'Octopus2.jpg',q:'octopus seabed'},bg:{q:'seabed sand rocks underwater'},vi:{q:'Arleigh Burke-class destroyer underway'},n:'Ośmiornica',food:['🐚','🦀','🐚','🦀'],s1:'#f6b6a0',s2:'#ffe5b8',g1:'#d98d8d',g2:'#b86a77',back:['🐚','🪸','🐚'],u:'Niszczyciel',v:'⛴️',a:3,p:2,s:5,c1:'#c85a8e',c2:'#7c2f64',
  t:'Ośmiornica na dnie',tx:'Ośmiornica trzyma muszlę ośmioma mackami i widzi… niszczyciel.',d:'Osiem rąk, osiem planów naraz.'}
];
var $=function(i){return document.getElementById(i)};
var cur=0,T=[],tick,sel=0;
/* ===== zdjęcia z Wikimedia Commons ===== */
var CACHE={};
function wm(f,w){return 'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(f)+'?width='+w}
function tryLoad(u,ok,bad){var i=new Image();i.onload=function(){ok(u)};i.onerror=bad;i.src=u}
function search(q,w){
 return fetch('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=10&prop=imageinfo&iiprop=url|size&iiurlwidth='+w+'&gsrsearch='+encodeURIComponent('filetype:bitmap '+q))
 .then(function(r){return r.json()}).then(function(d){
  var pg=Object.keys((d.query||{}).pages||{}).map(function(k){return d.query.pages[k]}).sort(function(a,b){return a.index-b.index});
  return pg.map(function(x){return x.imageinfo&&x.imageinfo[0]}).filter(function(i){return i&&i.width>=900&&i.width>=i.height*.9&&i.thumburl}).map(function(i){return i.thumburl})
 }).catch(function(){return []})
}
function getImg(sp,w){
 var k=(sp.f||sp.q)+w;
 return CACHE[k]||(CACHE[k]=new Promise(function(res){
  function viaApi(){search(sp.q||sp.f,w).then(function(l){(function n(j){if(j>=l.length)return res(null);tryLoad(l[j],res,function(){n(j+1)})})(0)})}
  if(sp.f)tryLoad(wm(sp.f,w),res,viaApi);else viaApi()
 }))
}
function applyScene(i){
 var c=S[i],root=$('intro');
 $('bgimg').className='bgimg';root.classList.remove('photo');
 $('hp').style.display='none';$('hero').style.display='';
 $('vimg').style.display='none';$('veh').style.display='';
 getImg(c.bg,1400).then(function(u){if(!u||cur!=i)return;$('bgimg').style.backgroundImage='url('+u+')';root.classList.add('photo');requestAnimationFrame(function(){$('bgimg').className='bgimg on'})});
 getImg(c.img,700).then(function(u){if(!u||cur!=i)return;$('hp').src=u;$('hp').style.display='block';$('hero').style.display='none'});
 getImg(c.vi,700).then(function(u){if(!u||cur!=i)return;$('vimg').src=u;$('vimg').style.display='block';$('veh').style.display='none'});
}

function later(f,ms){T.push(setTimeout(f,ms))}
function clr(){T.forEach(clearTimeout);T=[];clearInterval(tick)}
function show(id){['title','intro','select','battle'].forEach(function(x){$(x).classList.toggle('on',x==id)})}

function scene(i){
 clr();cur=i;var c=S[i],r=document.documentElement.style;
 var root=$('intro');root.style.background='linear-gradient('+c.s1+','+c.s2+' 70%)';
 root.style.setProperty('--g1',c.g1);root.style.setProperty('--g2',c.g2);
 $('hero').textContent=c.h;$('idea').className='idea';$('think').className='think';
 $('back').innerHTML=c.back.map(function(e){return '<span>'+e+'</span>'}).join('');
 $('bar').innerHTML=S.map(function(_,k){return '<i class="'+(k<i?'done':k==i?'act':'')+'"><b></b></i>'}).join('');
 $('ct').textContent=c.t;$('cp').textContent='';applyScene(i);
 var f=0;$('food').textContent=c.food[0];
 tick=setInterval(function(){f++;$('food').textContent=c.food[f%4]},350);
 later(function(){$('cp').textContent=c.tx.split('. ')[0]+'.'},300);
